<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Document API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .error { background: #ffe6e6; color: #cc0000; }
        .success { background: #e6ffe6; color: #006600; }
        button { padding: 10px 20px; margin: 5px; }
        iframe { width: 100%; height: 400px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Document API Security Test</h1>
    
    <div class="test-section">
        <h3>Test Secure Document API</h3>
        <button onclick="testDocumentAPI()">Test API Endpoint</button>
        <div id="api-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Test Document Viewer Integration</h3>
        <button onclick="testDocumentViewer()">Test PDF Viewer</button>
        <div id="viewer-result" class="result"></div>
        <iframe id="pdf-viewer" style="display: none;"></iframe>
    </div>

    <script>
        async function testDocumentAPI() {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                // Test with a sample document ID and user ID
                const testDocumentId = 'test-doc-123';
                const testUserId = 'test-user-456';
                
                const response = await fetch(`/api/documents/${testDocumentId}/view?userId=${encodeURIComponent(testUserId)}&action=view`);
                
                resultDiv.className = 'result';
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>API Test Result:</strong><br>
                        Status: ${response.status}<br>
                        Success: ${data.success}<br>
                        Document ID: ${data.documentId}<br>
                        File Name: ${data.fileName}<br>
                        File Type: ${data.fileType}<br>
                        Expires In: ${data.expiresIn} seconds<br>
                        Signed URL: ${data.signedUrl ? 'Generated ✓' : 'Not generated ✗'}
                    `;
                } else {
                    const errorData = await response.json();
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>API Test Failed:</strong><br>
                        Status: ${response.status}<br>
                        Error: ${errorData.error}<br>
                        Details: ${errorData.details || 'No details'}
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>Network Error:</strong><br>${error.message}`;
            }
        }

        async function testDocumentViewer() {
            const resultDiv = document.getElementById('viewer-result');
            const iframe = document.getElementById('pdf-viewer');
            
            resultDiv.innerHTML = 'Testing document viewer...';
            
            try {
                // Simulate DocumentViewer loadDocumentContent function
                const testDoc = {
                    documentId: 'sample-pdf-123',
                    userId: 'viewer-test-user',
                    name: 'sample-document.pdf',
                    type: 'application/pdf'
                };
                
                const response = await fetch(`/api/documents/${testDoc.documentId}/view?userId=${encodeURIComponent(testDoc.userId)}&action=view`);
                
                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.success && data.signedUrl) {
                        resultDiv.className = 'result success';
                        resultDiv.innerHTML = `
                            <strong>Document Viewer Test:</strong><br>
                            Document loaded successfully ✓<br>
                            Signed URL generated ✓<br>
                            File: ${data.fileName}<br>
                            Type: ${data.fileType}<br>
                            <button onclick="loadInIframe('${data.signedUrl}')">Load in iframe</button>
                        `;
                    } else {
                        throw new Error(data.error || 'Failed to get signed URL');
                    }
                } else {
                    const errorData = await response.json();
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>Document Viewer Test Failed:</strong><br>
                        Status: ${response.status}<br>
                        Error: ${errorData.error}
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>Viewer Test Error:</strong><br>${error.message}`;
            }
        }

        function loadInIframe(url) {
            const iframe = document.getElementById('pdf-viewer');
            iframe.src = url;
            iframe.style.display = 'block';
        }
    </script>
</body>
</html>
